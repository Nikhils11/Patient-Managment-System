services:
  patient-service:
    build:
      context: ./patient-service
      dockerfile: Dockerfile.yaml
    ports:
      - "4000:4000"
    depends_on:
      patient-service-db:
        condition: service_healthy
    environment:
      POSTGRES_USER: patientserviceuser
      POSTGRES_PASSWORD: SimplePass123
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/patient
      SPRING_SQL_INIT_MODE: always
      SRPING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"

  patient-service-db:
    image: postgres:12
    environment:
      - POSTGRES_USER=patientserviceuser
      # - POSTGRES_DB=patientServiceDB
      # I am using a openSLL base 64 encrypted password for the postgres user. This password is just an exmaple pleaes update it before using
      - POSTGRES_PASSWORD=SimplePass123
      - POSTGRES_DB=patient
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./patient-service/src/main/resources/data.sql:/docker-entrypoint-initdb.d/data.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready"]
volumes:
  postgres_data:
