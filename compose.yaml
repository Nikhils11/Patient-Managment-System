services:
  patient-service:
    build:
      context: ./patient-service
      dockerfile: Dockerfile.yaml
    ports:
      - "4000:4000"
    depends_on:
      patient-service-db:
        condition: service_healthy
    environment:
      POSTGRES_USER: patientserviceuser
      POSTGRES_PASSWORD: SimplePass123
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/patientServiceDB

  patient-service-db:
    image: postgres:12
    environment:
      - POSTGRES_USER=patientserviceuser
      # - POSTGRES_DB=patientServiceDB
      # I am using a openSLL base 64 encrypted password for the postgres user. This password is just an exmaple pleaes update it before using
      - POSTGRES_PASSWORD=SimplePass123
      - POSTGRES_DB=patientServiceDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready"]
volumes:
  postgres_data:
